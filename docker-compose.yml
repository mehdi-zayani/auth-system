# -----------------------------------------------------
# Docker Compose configuration
#
# Description:
# Starts the PostgreSQL database required by the application.
# Environment variables can optionally be provided through
# a local .env file. Default values are used when variables
# are not defined.
# -----------------------------------------------------

services:

  postgres:
    image: postgres:17

    container_name: auth-system-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_system}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - auth-system-network


volumes:
  postgres-data:


networks:
  auth-system-network: