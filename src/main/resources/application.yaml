# -----------------------------------------------------
# Application
# -----------------------------------------------------

spring:
  application:
    name: auth-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# -----------------------------------------------------
# Server
# -----------------------------------------------------

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

# -----------------------------------------------------
# Spring Boot Actuator
# -----------------------------------------------------

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

  info:
    env:
      enabled: true

# -----------------------------------------------------
# Application information
# -----------------------------------------------------

info:
  app:
    name: Auth System
    description: Production-ready authentication and authorization API built with Spring Boot and JWT
    version: 1.0.0
    author: Mehdi Zayani

# -----------------------------------------------------
# Logging
# -----------------------------------------------------

logging:
  level:
    root: INFO

# -----------------------------------------------------
# JWT
# -----------------------------------------------------

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:3600000}